<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Task Sender</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e6e6;
    margin: 0; padding: 24px; max-width: 800px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: .05em; color: #8a8f98; margin: 16px 0 6px; }
  textarea, input {
    width: 100%; padding: 10px 12px; background: #1a1d23;
    border: 1px solid #2a2f38; border-radius: 8px;
    color: #e6e6e6; font-family: inherit; font-size: 14px;
    resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: #4a7cff; }
  button {
    margin-top: 16px; padding: 10px 18px; border-radius: 8px;
    border: none; background: #4a7cff; color: white; font-weight: 600;
    cursor: pointer; font-size: 14px;
  }
  button:disabled { background: #2a2f38; cursor: not-allowed; }
  button.secondary { background: #2a2f38; }
  #status { margin-top: 12px; font-size: 13px; color: #8a8f98; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  #answer {
    margin-top: 20px; padding: 16px; background: #1a1d23;
    border-radius: 8px; white-space: pre-wrap; font-size: 14px;
    border: 1px solid #2a2f38; min-height: 40px;
  }
  .row { display: flex; gap: 12px; align-items: end; }
  .row > * { flex: 1; }
  .row button { flex: 0 0 auto; margin-top: 0; }
  #taskid { font-family: ui-monospace, monospace; font-size: 12px; color: #6a6f78; margin-top: 8px; }
</style>
</head>
<body>

<h1>Отправить задачу в локальную LLM</h1>

<div>
  <button id="authBtn">Войти в Google</button>
  <span id="status">Не авторизован</span>
</div>

<label for="system">System prompt</label>
<textarea id="system" rows="3">Ты полезный ассистент. Отвечай кратко и по делу.</textarea>

<label for="user">User prompt</label>
<textarea id="user" rows="5" placeholder="Что спросить у модели?"></textarea>

<div class="row">
  <div>
    <label for="temp">Temperature: <span id="tempVal">0.7</span></label>
    <input type="range" id="temp" min="0" max="2" step="0.05" value="0.7">
  </div>
  <button id="sendBtn" disabled>Отправить</button>
</div>

<div id="taskid"></div>
<div id="answer"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ====== НАСТРОЙКИ ======
const CLIENT_ID = '596559235524-ng53meahch1qdoahf7vhrfkgmk9m6b91.apps.googleusercontent.com';
const TASK_FILE_ID = '11HHxDFXb7HsqtKQkSIRAs0CJXkEkGGgd';
const RESPONSE_FILE_ID = '1gz6r7mhQbfJBdDftoVf3mLB7Ux-53EAA';
const SCOPES = 'https://www.googleapis.com/auth/drive';
// =======================

let accessToken = null;
let tokenClient = null;
let pollTimer = null;

const $ = id => document.getElementById(id);

$('temp').addEventListener('input', e => $('tempVal').textContent = e.target.value);

window.onload = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) {
        setStatus('Ошибка авторизации: ' + resp.error, 'err');
        return;
      }
      accessToken = resp.access_token;
      setStatus('Авторизован ✓', 'ok');
      $('sendBtn').disabled = false;
      $('authBtn').textContent = 'Переавторизоваться';
    }
  });
};

function setStatus(text, cls = '') {
  const el = $('status');
  el.textContent = text;
  el.className = cls;
}

$('authBtn').onclick = () => {
  tokenClient.requestAccessToken({ prompt: '' });
};

$('sendBtn').onclick = async () => {
  const userPrompt = $('user').value.trim();
  if (!userPrompt) { setStatus('User prompt пустой', 'err'); return; }

  const taskId = 'task-' + Date.now();
  const task = {
    id: taskId,
    system_prompt: $('system').value.trim(),
    user_prompt: userPrompt,
    temperature: parseFloat($('temp').value)
  };

  $('sendBtn').disabled = true;
  setStatus('Отправляю task.json...');
  $('answer').textContent = '';
  $('taskid').textContent = 'Task ID: ' + taskId;

  try {
    const res = await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${TASK_FILE_ID}?uploadType=media`,
      {
        method: 'PATCH',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(task)
      }
    );

    if (!res.ok) {
      const err = await res.text();
      setStatus('Drive ошибка: ' + res.status + ' — ' + err, 'err');
      $('sendBtn').disabled = false;
      return;
    }

    setStatus('Задача отправлена. Ждём ответ...', 'ok');
    startPolling(taskId);

  } catch (e) {
    setStatus('Сеть: ' + e.message, 'err');
    $('sendBtn').disabled = false;
  }
};

function startPolling(taskId) {
  if (pollTimer) clearInterval(pollTimer);
  let attempts = 0;
  const maxAttempts = 1024; // 120 * 2s = 4 минуты

  pollTimer = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) {
      clearInterval(pollTimer);
      setStatus('Таймаут: ответа нет 4 минуты', 'err');
      $('sendBtn').disabled = false;
      return;
    }

    try {
      const res = await fetch(
        `https://www.googleapis.com/drive/v3/files/${RESPONSE_FILE_ID}?alt=media`,
        { headers: { 'Authorization': 'Bearer ' + accessToken } }
      );
      if (!res.ok) return;

      const data = await res.json();
      if (data.task_id === taskId) {
        clearInterval(pollTimer);
        $('answer').textContent = data.answer || '(пустой ответ)';
        setStatus('Готово ✓', 'ok');
        $('sendBtn').disabled = false;
      }
    } catch (e) {
      // тихо игнорим — файл может быть в момент записи
    }
  }, 2000);
}
</script>
</body>
</html>
